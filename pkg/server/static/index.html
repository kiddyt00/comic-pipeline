<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 漫剧流水线</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <div class="max-w-5xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8">🎬 AI 漫剧流水线</h1>

        <div class="bg-gray-900 rounded-lg p-6 mb-8 border border-gray-800">
            <h2 class="text-lg font-semibold mb-4">新建项目</h2>
            <form hx-post="/projects" hx-target="#project-list" hx-swap="afterbegin"
                  hx-on::after-request="this.reset()" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">标题</label>
                    <input type="text" name="title" required
                           class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2
                                  focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">世界观设定</label>
                    <textarea name="world_setting" rows="3"
                              class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2
                                     focus:outline-none focus:border-indigo-500"
                              placeholder="仙侠世界，灵气复苏..."></textarea>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">故事文本（1-2章）</label>
                    <textarea name="story_text" rows="8" required
                              class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2
                                     focus:outline-none focus:border-indigo-500"
                              placeholder="粘贴你的故事..."></textarea>
                </div>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded">
                    创建项目
                </button>
            </form>
        </div>

        <div id="project-list" hx-get="/projects" hx-trigger="load, every 10s"
             class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="text-gray-500 col-span-full text-center py-8">加载中...</div>
        </div>
    </div>
</body>
</html>
