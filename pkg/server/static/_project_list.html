{{ if . }}
{{ range . }}
<div class="bg-gray-900 rounded-lg p-4 border border-gray-800 hover:border-indigo-500 transition-colors">
    <a href="/projects/{{ .ID }}" class="block">
        <h3 class="font-semibold text-lg mb-1">{{ .Title }}</h3>
    </a>
    <div class="flex items-center gap-3 text-sm text-gray-400 mt-2">
        <span>{{ if eq .Status "draft" }}📝 草稿{{ else if eq .Status "producing" }}🔄 制作中{{ else }}✅ 已完成{{ end }}</span>
        <span>{{ .EpisodeCount }} 集</span>
    </div>
    <button hx-delete="/projects/{{ .ID }}" hx-target="closest div" hx-swap="outerHTML"
            class="text-red-400 hover:text-red-300 text-xs mt-2">
        删除
    </button>
</div>
{{ end }}
{{ else }}
<div class="text-gray-500 col-span-full text-center py-8">暂无项目，创建第一个吧</div>
{{ end }}
